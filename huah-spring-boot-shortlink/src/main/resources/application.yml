      sharding:
        tables:
          short_urls:
            actual-data-nodes: ds$->{0..1023}.short_urls_$->{0..1023}
            table-strategy:
              standard:
                sharding-column: id
                sharding-algorithm-name: table-inline
            database-strategy:
